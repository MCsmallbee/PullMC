[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pullmc"
dynamic = ["version"]
description = "Minecraft Java Edition downloader and deployer with a PySide6/QML desktop UI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "MCsmallbee" }]
dependencies = [
    "PySide6==6.10.0",
    "RinUI==0.4.4.1",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.gui-scripts]
pullmc = "pullmc.app:main"

[tool.setuptools.dynamic]
version = { attr = "pullmc.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["pullmc*"]

[tool.setuptools.package-data]
pullmc = [
    "qml/*.qml",
    "qml/**/*.qml",
    "qml/**/qmldir",
    "i18n_data/*.json",
    "res/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
